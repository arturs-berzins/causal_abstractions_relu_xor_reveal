<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-1-1-1 fiber explorer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --hairline: #d7d7d7;
      --grid: #c9c9c9;
      --fiber: #2b963d;
      --fiber-fill: #9dcea5;
      --fiber-selected: #186c2a;
      --neuron-1: #b17b2d;
      --neuron-2: #8064a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1460px, 100%);
      margin: 0 auto;
      padding: 28px clamp(18px, 3vw, 48px) 38px;
    }

    header {
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--hairline);
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(23px, 2.6vw, 34px);
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .explorer {
      display: grid;
      grid-template-columns: minmax(590px, 1.15fr) minmax(420px, 0.85fr);
      gap: clamp(28px, 4vw, 62px);
      align-items: start;
    }

    body.embed main {
      width: min(1740px, 100%);
      padding: 0 30px 24px;
    }

    body.embed header {
      display: none;
    }

    body.embed .explorer {
      grid-template-columns: minmax(680px, 1.15fr) minmax(520px, 0.85fr);
      gap: 56px;
    }

    #fiber-plot,
    #activation-plot {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    #fiber-plot {
      cursor: crosshair;
      touch-action: none;
      user-select: none;
    }

    #fiber-plot.rotating {
      cursor: grabbing;
    }

    .activation-shell {
      align-self: center;
    }

    .grid-line,
    .cube-edge,
    .axis-line,
    .surface-edge,
    .surface-seam,
    .output-line,
    .activation-line,
    .chart-grid-line,
    .plot-border,
    .tick-line {
      vector-effect: non-scaling-stroke;
    }

    .grid-line {
      fill: none;
      stroke: var(--grid);
      stroke-width: 0.8;
      opacity: 0.48;
    }

    .cube-edge {
      fill: none;
      stroke: #a9a9a9;
      stroke-width: 0.9;
      opacity: 0.72;
    }

    .axis-line {
      fill: none;
      stroke: #4f4f4f;
      stroke-width: 1.55;
    }

    .surface-triangle {
      fill: var(--fiber-fill);
      stroke: none;
      opacity: 0.48;
    }

    .surface-triangle.selected-face {
      fill: #82bc8d;
      opacity: 0.60;
    }

    .surface-edge {
      fill: none;
      stroke: var(--fiber);
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .surface-seam {
      fill: none;
      stroke: var(--fiber-selected);
      stroke-width: 2.25;
      opacity: 1;
    }

    .selected-halo {
      fill: #ffffff;
      stroke: var(--ink);
      stroke-width: 3.2;
      vector-effect: non-scaling-stroke;
    }

    .selected-dot {
      fill: var(--ink);
    }

    .fiber-tip {
      fill: var(--fiber-selected);
      stroke: none;
      vector-effect: non-scaling-stroke;
    }

    .axis-label,
    .tick-label,
    .legend-label {
      fill: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .axis-label {
      font-size: 15px;
      font-style: italic;
    }

    .tick-label,
    .legend-label {
      font-size: 12px;
    }

    .plot-border {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.05;
    }

    .tick-line {
      stroke: var(--ink);
      stroke-width: 1;
    }

    .chart-grid-line {
      stroke: var(--grid);
      stroke-width: 0.8;
      opacity: 0.52;
    }

    .activation-line {
      fill: none;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.58;
    }

    .output-line {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .train-point {
      fill: var(--ink);
      stroke: none;
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 980px) {
      .explorer,
      body.embed .explorer {
        grid-template-columns: 1fr;
      }

      .activation-shell {
        width: min(620px, 100%);
        margin: 0 auto;
      }
    }

    @media (max-width: 520px) {
      main {
        padding-inline: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Fiber explorer — 1–1–1–1</h1>
    </header>

    <div class="explorer">
      <section>
        <svg id="fiber-plot" viewBox="0 0 650 570" role="img" aria-labelledby="fiber-svg-title fiber-svg-desc">
          <title id="fiber-svg-title">Three-dimensional lifted ReLU fiber</title>
          <desc id="fiber-svg-desc">Two clipped components of the lifted fiber in coordinates u1, u2, and u3. Click or drag to select a point and Command-drag to rotate.</desc>
        </svg>
      </section>

      <section class="activation-shell">
        <svg id="activation-plot" viewBox="0 0 600 420" role="img" aria-labelledby="activation-svg-title activation-svg-desc">
          <title id="activation-svg-title">Network output and neuron activations at the selected fiber point</title>
          <desc id="activation-svg-desc">The network output in black and the two serial ReLU neuron activations as light colored lines.</desc>
        </svg>
      </section>
    </div>
  </main>

  <script>
    if (new URLSearchParams(window.location.search).has("embed")) {
      document.body.classList.add("embed");
    }

    const NS = "http://www.w3.org/2000/svg";
    const fiberSvg = document.getElementById("fiber-plot");
    const activationSvg = document.getElementById("activation-plot");

    const geometry = {
      limit: 3,
      faces: [
        {
          id: "lower-left",
          chart: [1, 1],
          vertices: [[2, 2, -3], [3, 1, -3], [3, -2, 0], [0.5, 0.5, 0]]
        },
        {
          id: "lower-right",
          chart: [1, 1],
          vertices: [[0.5, 3, -2.5], [1, 3, -3], [2, 2, -3], [0.5, 0.5, 0]]
        },
        {
          id: "upper-flat",
          chart: [-1, 1],
          vertices: [[3, 2, 1], [3, -3, 1], [0.5, -0.5, 1]]
        },
        {
          id: "upper-fold",
          chart: [-1, 1],
          vertices: [[0.5, -0.5, 1], [3, -3, 1], [1, -3, 3], [0.5, -2.5, 3]]
        }
      ],
      seams: [
        [[0.5, 0.5, 0], [2, 2, -3]],
        [[0.5, -0.5, 1], [3, -3, 1]]
      ],
      intrinsicEdges: [
        [[0.5, 0.5, 0], [3, -2, 0]],
        [[0.5, 0.5, 0], [0.5, 3, -2.5]],
        [[0.5, -0.5, 1], [3, 2, 1]],
        [[0.5, -0.5, 1], [0.5, -2.5, 3]]
      ],
      tips: [
        [0.5, 0.5, 0],
        [0.5, -0.5, 1]
      ],
      snapEdges: [
        { faceId: "lower-left", points: [[0.5, 0.5, 0], [3, -2, 0]] },
        { faceId: "lower-right", points: [[0.5, 0.5, 0], [0.5, 3, -2.5]] },
        { faceId: "lower-left", points: [[0.5, 0.5, 0], [2, 2, -3]] },
        { faceId: "upper-flat", points: [[0.5, -0.5, 1], [3, 2, 1]] },
        { faceId: "upper-fold", points: [[0.5, -0.5, 1], [0.5, -2.5, 3]] },
        { faceId: "upper-flat", points: [[0.5, -0.5, 1], [3, -3, 1]] }
      ]
    };

    const state = {
      camera: { azimuth: 1.239, elevation: 0.255, zoom: 1 },
      selectedFaceId: "lower-left",
      selectedPoint: [2.125, 0.375, -1.5],
      projectedTriangles: [],
      drag: null
    };

    function svgEl(name, attrs = {}, text = null) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (text !== null) node.textContent = text;
      return node;
    }

    function project(point) {
      const { azimuth, elevation, zoom } = state.camera;
      const ca = Math.cos(azimuth);
      const sa = Math.sin(azimuth);
      const ce = Math.cos(elevation);
      const se = Math.sin(elevation);
      const right = [sa, -ca, 0];
      const up = [-se * ca, -se * sa, ce];
      const toward = [ce * ca, ce * sa, se];
      const scale = 60 * zoom;
      return {
        x: 325 + scale * (point[0] * right[0] + point[1] * right[1]),
        y: 286 - scale * (point[0] * up[0] + point[1] * up[1] + point[2] * up[2]),
        depth: point[0] * toward[0] + point[1] * toward[1] + point[2] * toward[2]
      };
    }

    function line3d(a, b, className, attrs = {}) {
      const pa = project(a);
      const pb = project(b);
      return svgEl("line", {
        x1: pa.x,
        y1: pa.y,
        x2: pb.x,
        y2: pb.y,
        class: className,
        ...attrs
      });
    }

    function appendGrid(root) {
      const l = 3.15;
      const ticks = [-3, -2, -1, 0, 1, 2, 3];

      ticks.forEach(tick => {
        root.appendChild(line3d([-l, tick, -l], [l, tick, -l], "grid-line"));
        root.appendChild(line3d([tick, -l, -l], [tick, l, -l], "grid-line"));
        root.appendChild(line3d([-l, -l, tick], [l, -l, tick], "grid-line"));
        root.appendChild(line3d([tick, -l, -l], [tick, -l, l], "grid-line"));
        root.appendChild(line3d([-l, -l, tick], [-l, l, tick], "grid-line"));
        root.appendChild(line3d([-l, tick, -l], [-l, tick, l], "grid-line"));
      });

      const corners = [
        [-l, -l, -l], [l, -l, -l], [l, l, -l], [-l, l, -l],
        [-l, -l, l], [l, -l, l], [l, l, l], [-l, l, l]
      ];
      const edges = [
        [0, 1], [1, 2], [2, 3], [3, 0],
        [4, 5], [5, 6], [6, 7], [7, 4],
        [0, 4], [1, 5], [2, 6], [3, 7]
      ];
      edges.forEach(([a, b]) => root.appendChild(line3d(corners[a], corners[b], "cube-edge")));
    }

    function triangleFan(face) {
      const triangles = [];
      for (let i = 1; i < face.vertices.length - 1; i += 1) {
        triangles.push([face.vertices[0], face.vertices[i], face.vertices[i + 1]]);
      }
      return triangles;
    }

    function appendAxes(root) {
      const l = 3.22;
      const axes = [
        { a: [-l, 0, 0], b: [l, 0, 0], label: "u₁" },
        { a: [0, -l, 0], b: [0, l, 0], label: "u₂" },
        { a: [0, 0, -l], b: [0, 0, l], label: "u₃" }
      ];

      axes.forEach(axis => {
        root.appendChild(line3d(axis.a, axis.b, "axis-line", { "marker-end": "url(#axis-arrow)" }));
        const p = project(axis.b);
        const dx = p.x >= 325 ? 9 : -9;
        const anchor = p.x >= 325 ? "start" : "end";
        root.appendChild(svgEl("text", {
          x: p.x + dx,
          y: p.y - 7,
          class: "axis-label",
          "text-anchor": anchor
        }, axis.label));
      });
    }

    function renderFiber() {
      fiberSvg.replaceChildren();
      fiberSvg.appendChild(svgEl("title", { id: "fiber-svg-title" }, "Three-dimensional lifted ReLU fiber"));
      fiberSvg.appendChild(svgEl("desc", { id: "fiber-svg-desc" }, "Two clipped components of the lifted fiber in coordinates u1, u2, and u3. Click or drag to select a point and Command-drag to rotate."));

      const defs = svgEl("defs");
      const marker = svgEl("marker", {
        id: "axis-arrow",
        viewBox: "0 0 10 10",
        refX: 8.5,
        refY: 5,
        markerWidth: 6,
        markerHeight: 6,
        orient: "auto-start-reverse"
      });
      marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#4f4f4f" }));
      defs.appendChild(marker);
      fiberSvg.appendChild(defs);

      const gridGroup = svgEl("g", { "pointer-events": "none" });
      appendGrid(gridGroup);
      fiberSvg.appendChild(gridGroup);

      const projected = [];
      geometry.faces.forEach(face => {
        triangleFan(face).forEach((vertices, triangleIndex) => {
          const screen = vertices.map(project);
          projected.push({
            face,
            triangleIndex,
            vertices,
            screen,
            depth: screen.reduce((sum, point) => sum + point.depth, 0) / 3
          });
        });
      });
      projected.sort((a, b) => a.depth - b.depth);
      state.projectedTriangles = projected;

      const surfaceGroup = svgEl("g");
      projected.forEach(item => {
        surfaceGroup.appendChild(svgEl("polygon", {
          points: item.screen.map(point => `${point.x},${point.y}`).join(" "),
          class: `surface-triangle${item.face.id === state.selectedFaceId ? " selected-face" : ""}`,
          "data-face": item.face.id
        }));
      });
      fiberSvg.appendChild(surfaceGroup);

      const edgesGroup = svgEl("g", { "pointer-events": "none" });
      geometry.intrinsicEdges.forEach(edge => edgesGroup.appendChild(line3d(edge[0], edge[1], "surface-edge")));
      geometry.seams.forEach(seam => edgesGroup.appendChild(line3d(seam[0], seam[1], "surface-seam")));
      fiberSvg.appendChild(edgesGroup);

      const axesGroup = svgEl("g", { "pointer-events": "none" });
      appendAxes(axesGroup);
      fiberSvg.appendChild(axesGroup);

      const tipsGroup = svgEl("g", { "pointer-events": "none" });
      geometry.tips.forEach(tip => {
        const projectedTip = project(tip);
        tipsGroup.appendChild(svgEl("circle", {
          cx: projectedTip.x,
          cy: projectedTip.y,
          r: 3.5,
          class: "fiber-tip"
        }));
      });
      fiberSvg.appendChild(tipsGroup);

      const selected = project(state.selectedPoint);
      const markerGroup = svgEl("g", { "pointer-events": "none" });
      markerGroup.appendChild(svgEl("circle", {
        cx: selected.x,
        cy: selected.y,
        r: 8,
        class: "selected-halo"
      }));
      markerGroup.appendChild(svgEl("circle", {
        cx: selected.x,
        cy: selected.y,
        r: 2.8,
        class: "selected-dot"
      }));
      fiberSvg.appendChild(markerGroup);

      fiberSvg.appendChild(svgEl("rect", {
        x: 0,
        y: 0,
        width: 650,
        height: 570,
        fill: "#ffffff",
        "fill-opacity": 0,
        "pointer-events": "all"
      }));
    }

    function barycentric(point, triangle) {
      const [a, b, c] = triangle;
      const denominator = (b.y - c.y) * (a.x - c.x) + (c.x - b.x) * (a.y - c.y);
      if (Math.abs(denominator) < 1e-8) return null;
      const w0 = ((b.y - c.y) * (point.x - c.x) + (c.x - b.x) * (point.y - c.y)) / denominator;
      const w1 = ((c.y - a.y) * (point.x - c.x) + (a.x - c.x) * (point.y - c.y)) / denominator;
      const w2 = 1 - w0 - w1;
      return [w0, w1, w2];
    }

    function closestPointOnSegment(point, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const lengthSquared = dx * dx + dy * dy;
      const t = lengthSquared > 1e-10
        ? Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSquared))
        : 0;
      const x = a.x + t * dx;
      const y = a.y + t * dy;
      return { x, y, t, distance: Math.hypot(point.x - x, point.y - y) };
    }

    function selectAt(clientX, clientY) {
      const rect = fiberSvg.getBoundingClientRect();
      const point = {
        x: ((clientX - rect.left) / rect.width) * 650,
        y: ((clientY - rect.top) / rect.height) * 570
      };
      const candidates = [];
      const edgeCandidates = [];

      state.projectedTriangles.forEach(item => {
        const weights = barycentric(point, item.screen);
        if (!weights || weights.some(weight => weight < -0.018)) return;
        const depth = weights.reduce((sum, weight, i) => sum + weight * item.screen[i].depth, 0);
        candidates.push({ item, weights, depth });
      });

      geometry.snapEdges.forEach(edge => {
        const screen = edge.points.map(project);
        const closest = closestPointOnSegment(point, screen[0], screen[1]);
        if (closest.distance > 5.5) return;
        edgeCandidates.push({
          edge,
          closest,
          depth: screen[0].depth + closest.t * (screen[1].depth - screen[0].depth)
        });
      });

      if (edgeCandidates.length) {
        edgeCandidates.sort((a, b) => a.closest.distance - b.closest.distance || b.depth - a.depth);
        const chosenEdge = edgeCandidates[0];
        state.selectedFaceId = chosenEdge.edge.faceId;
        state.selectedPoint = [0, 1, 2].map(axis => (
          chosenEdge.edge.points[0][axis]
          + chosenEdge.closest.t * (chosenEdge.edge.points[1][axis] - chosenEdge.edge.points[0][axis])
        ));
        renderFiber();
        renderActivations();
        return;
      }

      if (!candidates.length) return;

      candidates.sort((a, b) => b.depth - a.depth);
      const chosen = candidates[0];
      state.selectedFaceId = chosen.item.face.id;
      state.selectedPoint = [0, 1, 2].map(axis => chosen.weights.reduce(
        (sum, weight, i) => sum + weight * chosen.item.vertices[i][axis],
        0
      ));
      renderFiber();
      renderActivations();
    }

    function activationState(x, point, chart) {
      const [u1, u2, u3] = point;
      const [s2, s3] = chart;
      const liftedFirst = u1 * x + u2;
      const firstValue = s2 * s3 * liftedFirst;
      const g1 = firstValue >= -1e-9;
      const liftedSecond = u3 + (g1 ? liftedFirst : 0);
      const secondValue = s3 * liftedSecond;
      return {
        first: Math.max(0, firstValue) / 6,
        second: Math.max(0, secondValue) / 6,
        output: s3 * Math.max(0, secondValue)
      };
    }

    function selectedFace() {
      return geometry.faces.find(face => face.id === state.selectedFaceId);
    }

    function renderActivations() {
      const point = state.selectedPoint;
      const chart = selectedFace().chart;
      const xMin = -1.1;
      const xMax = 1.1;
      const yMin = -0.15;
      const yMax = 1.35;
      const plot = { left: 78, right: 558, top: 15, bottom: 335 };
      const mapX = x => plot.left + ((x - xMin) / (xMax - xMin)) * (plot.right - plot.left);
      const mapY = y => plot.bottom - ((y - yMin) / (yMax - yMin)) * (plot.bottom - plot.top);
      const firstSamples = [];
      const secondSamples = [];
      const outputSamples = [];
      for (let i = 0; i <= 600; i += 1) {
        const x = xMin + (i / 600) * (xMax - xMin);
        const activations = activationState(x, point, chart);
        firstSamples.push([x, activations.first]);
        secondSamples.push([x, activations.second]);
        outputSamples.push([x, activations.output]);
      }

      activationSvg.replaceChildren();
      activationSvg.appendChild(svgEl("title", { id: "activation-svg-title" }, "Network output and neuron activations at the selected fiber point"));
      activationSvg.appendChild(svgEl("desc", { id: "activation-svg-desc" }, "The network output in black and the two serial ReLU neuron activations as light colored lines."));

      const defs = svgEl("defs");
      const clip = svgEl("clipPath", { id: "activation-clip-1111" });
      clip.appendChild(svgEl("rect", {
        x: plot.left,
        y: plot.top,
        width: plot.right - plot.left,
        height: plot.bottom - plot.top
      }));
      defs.appendChild(clip);
      activationSvg.appendChild(defs);

      const yTicks = [0, 0.5, 1];
      yTicks.forEach(tick => {
        activationSvg.appendChild(svgEl("line", {
          x1: plot.left,
          y1: mapY(tick),
          x2: plot.right,
          y2: mapY(tick),
          class: "chart-grid-line"
        }));
      });

      const xTicks = [-1, 0, 1];

      const curves = svgEl("g", { "clip-path": "url(#activation-clip-1111)" });
      curves.appendChild(svgEl("polyline", {
        points: firstSamples.map(([x, y]) => `${mapX(x)},${mapY(y)}`).join(" "),
        class: "activation-line",
        stroke: "var(--neuron-1)"
      }));
      curves.appendChild(svgEl("polyline", {
        points: secondSamples.map(([x, y]) => `${mapX(x)},${mapY(y)}`).join(" "),
        class: "activation-line",
        stroke: "var(--neuron-2)"
      }));
      curves.appendChild(svgEl("polyline", {
        points: outputSamples.map(([x, y]) => `${mapX(x)},${mapY(y)}`).join(" "),
        class: "output-line"
      }));
      activationSvg.appendChild(curves);

      activationSvg.appendChild(svgEl("rect", {
        x: plot.left,
        y: plot.top,
        width: plot.right - plot.left,
        height: plot.bottom - plot.top,
        class: "plot-border"
      }));

      xTicks.forEach(tick => {
        const x = mapX(tick);
        activationSvg.appendChild(svgEl("line", {
          x1: x,
          y1: plot.bottom,
          x2: x,
          y2: plot.bottom + 7,
          class: "tick-line"
        }));
        activationSvg.appendChild(svgEl("text", {
          x,
          y: plot.bottom + 24,
          class: "tick-label",
          "text-anchor": "middle"
        }, String(tick)));
      });

      yTicks.forEach(tick => {
        const y = mapY(tick);
        activationSvg.appendChild(svgEl("line", {
          x1: plot.left - 7,
          y1: y,
          x2: plot.left,
          y2: y,
          class: "tick-line"
        }));
        activationSvg.appendChild(svgEl("text", {
          x: plot.left - 12,
          y: y + 4,
          class: "tick-label",
          "text-anchor": "end"
        }, String(tick)));
      });

      activationSvg.appendChild(svgEl("text", {
        x: (plot.left + plot.right) / 2,
        y: 382,
        class: "axis-label",
        "text-anchor": "middle"
      }, "x"));
      activationSvg.appendChild(svgEl("text", {
        x: 21,
        y: (plot.top + plot.bottom) / 2,
        class: "axis-label",
        "text-anchor": "middle",
        transform: `rotate(-90 21 ${(plot.top + plot.bottom) / 2})`
      }, "value"));

      const training = [
        { x: -1, y: 0 },
        { x: 1, y: 1 }
      ];
      training.forEach(sample => {
        activationSvg.appendChild(svgEl("circle", {
          cx: mapX(sample.x),
          cy: mapY(sample.y),
          r: 5.2,
          class: "train-point"
        }));
      });

      const legendY = 415;
      const legend = [
        { x: 96, color: "var(--ink)", className: "output-line", label: "output" },
        { x: 247, color: "var(--neuron-1)", className: "activation-line", label: "neuron 1" },
        { x: 404, color: "var(--neuron-2)", className: "activation-line", label: "neuron 2" }
      ];
      legend.forEach(item => {
        activationSvg.appendChild(svgEl("line", {
          x1: item.x,
          y1: legendY - 7,
          x2: item.x + 24,
          y2: legendY - 7,
          class: item.className,
          stroke: item.color
        }));
        activationSvg.appendChild(svgEl("text", {
          x: item.x + 32,
          y: legendY - 2,
          class: "legend-label"
        }, item.label));
      });
    }

    fiberSvg.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      const mode = event.metaKey ? "rotate" : "select";
      state.drag = {
        mode,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        azimuth: state.camera.azimuth,
        elevation: state.camera.elevation
      };
      fiberSvg.setPointerCapture(event.pointerId);
      if (mode === "rotate") {
        fiberSvg.classList.add("rotating");
      } else {
        selectAt(event.clientX, event.clientY);
      }
      event.preventDefault();
    });

    fiberSvg.addEventListener("pointermove", event => {
      if (!state.drag || state.drag.pointerId !== event.pointerId) return;
      if (state.drag.mode === "select") {
        selectAt(event.clientX, event.clientY);
        return;
      }
      const dx = event.clientX - state.drag.startX;
      const dy = event.clientY - state.drag.startY;
      state.camera.azimuth = state.drag.azimuth + dx * 0.007;
      state.camera.elevation = Math.max(-1.18, Math.min(1.18, state.drag.elevation + dy * 0.006));
      renderFiber();
    });

    fiberSvg.addEventListener("pointerup", event => {
      if (!state.drag || state.drag.pointerId !== event.pointerId) return;
      state.drag = null;
      fiberSvg.classList.remove("rotating");
    });

    fiberSvg.addEventListener("pointercancel", event => {
      if (!state.drag || state.drag.pointerId !== event.pointerId) return;
      state.drag = null;
      fiberSvg.classList.remove("rotating");
    });

    fiberSvg.addEventListener("wheel", event => {
      event.preventDefault();
      state.camera.zoom = Math.max(0.72, Math.min(1.45, state.camera.zoom * Math.exp(-event.deltaY * 0.001)));
      renderFiber();
    }, { passive: false });

    renderFiber();
    renderActivations();
  </script>
</body>
</html>
