<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lifted fiber explorer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #666666;
      --hairline: #d7d7d7;
      --blue: #2f6fa8;
      --blue-fill: #d7ebff;
      --red: #b54852;
      --red-fill: #f7d9dc;
      --neuron-1: #2f8f6b;
      --neuron-2: #8a6bbe;
      --target-0: #000000;
      --target-1: #a6612d;
      --target-2: #ffbd68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 28px clamp(18px, 3vw, 48px) 38px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--hairline);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(23px, 2.6vw, 34px);
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    header p {
      max-width: 520px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: right;
    }

    .explorer {
      display: grid;
      grid-template-columns: minmax(500px, 1.08fr) minmax(410px, 0.92fr);
      gap: clamp(28px, 4vw, 62px);
      align-items: start;
    }

    body.embed main {
      width: min(1700px, 100%);
      padding: 0 30px 24px;
    }

    body.embed header {
      display: none;
    }

    body.embed .explorer {
      grid-template-columns: minmax(620px, 1.08fr) minmax(500px, 0.92fr);
      gap: 56px;
    }

    body.embed h2 {
      font-size: 24px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      min-height: 34px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 18px;
      font-weight: 400;
    }

    .fiber-components {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }

    .wedge-button {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: crosshair;
      touch-action: none;
    }

    .wedge-button:focus-visible {
      outline: 3px solid rgba(47, 111, 168, 0.28);
      outline-offset: 4px;
    }

    .wedge-button svg,
    #partition-plot {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .partition-shell {
      min-width: 0;
    }

    .partition-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .plot-border,
    .axis-line {
      fill: none;
      stroke: #171717;
      vector-effect: non-scaling-stroke;
    }

    .plot-border {
      stroke-width: 1.15;
    }

    .axis-line {
      stroke-width: 1;
    }

    .tick-line {
      stroke: #171717;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .tick-label,
    .axis-label,
    .plot-label,
    .legend-label {
      fill: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .tick-label,
    .legend-label {
      font-size: 12px;
    }

    .axis-label {
      font-size: 15px;
    }

    .plot-label {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .fiber-ray,
    .partition-line {
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .fiber-ray {
      stroke-width: 2.1;
    }

    .chart-break-line {
      stroke: #171717;
      stroke-width: 1;
      stroke-dasharray: 4 5;
      opacity: 0.42;
      vector-effect: non-scaling-stroke;
    }

    .partition-line {
      stroke-width: 2.2;
    }

    .train-point {
      stroke: #ffffff;
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 920px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      header p {
        text-align: left;
      }

      .explorer {
        grid-template-columns: 1fr;
      }

      .partition-shell {
        width: min(620px, 100%);
        margin: 0 auto;
      }
    }

    @media (max-width: 520px) {
      main {
        padding-inline: 14px;
      }

      .fiber-components {
        gap: 12px;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Fiber explorer </h1>
      <!-- <p>Select or drag a point inside any wedge. The adjacent plot shows the two ReLU hyperplanes at that exact point on the fiber.</p> -->
    </header>

    <div class="explorer">
      <section aria-labelledby="fiber-heading">
        <div class="section-heading">
          <h2 id="fiber-heading">Lifted fiber (projected)</h2>
        </div>
        <div class="fiber-components" id="fiber-grid"></div>
      </section>

      <section class="partition-shell" aria-labelledby="partition-heading">
        <div class="section-heading">
          <h2 id="partition-heading">Input-space partition</h2>
        </div>
        <svg id="partition-plot" viewBox="0 0 500 500" role="img" aria-labelledby="partition-svg-title partition-svg-desc">
          <title id="partition-svg-title">Input-space partition at the selected fiber point</title>
          <desc id="partition-svg-desc">Training inputs and the zero-preactivation lines of two hidden ReLU neurons.</desc>
        </svg>
        <p class="partition-note" id="partition-note"></p>
      </section>
    </div>
  </main>

  <script>
    if (new URLSearchParams(window.location.search).has("embed")) {
      document.body.classList.add("embed");
    }

    const geometry = {
      signChart: "-+",
      trainX: [[0, 2, 1], [1, 0, 1], [1, 1, 1], [2, 0, 1], [2, 2, 1]],
      trainPairs: [[0, 2], [1, 0], [1, 1], [2, 0], [2, 2]],
      trainY: [2, 1, 2, 2, 1],
      wedges: [
        {
          maskIds: [2, 31],
          component: 0,
          vertex: [1.5, 1.5, -3, -0.5, -0.5, 3],
          basis: [[0.666666666667, -0.235702260396], [0.333333333333, 0.942809041582], [-0.666666666667, 0.235702260396], [0, 0], [0, 0], [0, 0]],
          rays: [[1, 0], [0.333333333333, 0.942809041582]],
          mirror: true
        },
        {
          maskIds: [15, 31],
          component: 0,
          vertex: [1.5, 1.5, -3, -0.5, -0.5, 3],
          basis: [[0, 0.527046276695], [0.316227766017, -0.421637021356], [-0.632455532034, -0.210818510678], [0, -0.527046276695], [-0.316227766017, 0.421637021356], [0.632455532034, 0.210818510678]],
          rays: [[1, 0], [0.8, 0.6]],
          mirror: false
        },
        {
          maskIds: [29, 31],
          component: 1,
          vertex: [-1.5, -1.5, 3, 1, 1, 0],
          basis: [[-0.471404520791, 0.166666666667], [-0.235702260396, -0.666666666667], [0.471404520791, -0.166666666667], [0.471404520791, -0.166666666667], [0.235702260396, 0.666666666667], [-0.471404520791, 0.166666666667]],
          rays: [[1, 0], [0.333333333333, 0.942809041582]],
          mirror: true
        },
        {
          maskIds: [16, 31],
          component: 1,
          vertex: [-1.5, -1.5, 3, 1, 1, 0],
          basis: [[0, -0.7453559925], [-0.4472135955, 0.596284793999], [0.894427190999, 0.298142397], [0, 0], [0, 0], [0, 0]],
          rays: [[1, 0], [0.8, 0.6]],
          mirror: false
        }
      ]
    };

    const NS = "http://www.w3.org/2000/svg";
    const fiberGrid = document.getElementById("fiber-grid");
    const partitionSvg = document.getElementById("partition-plot");
    const partitionNote = document.getElementById("partition-note");
    const extent = 3;
    const view = {
      width: 600,
      height: 260,
      left: 18,
      top: 12,
      halfWidth: 282,
      plotHeight: 224,
      seamX: 300,
      low: -0.08 * extent,
      high: extent
    };
    const state = {
      selected: 1,
      coefficients: geometry.wedges.map(() => [1, 1]),
      dragging: false
    };

    function svgEl(name, attrs = {}, text = null) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (text !== null) node.textContent = text;
      return node;
    }

    function maskLabel(maskIds) {
      return maskIds.map(mask => {
        let label = "";
        for (let n = 0; n < geometry.trainX.length; n += 1) {
          label += ((mask >> n) & 1) ? "+" : "−";
        }
        return label;
      }).join(" | ");
    }

    function planePoint(wedge, coefficients) {
      return [
        coefficients[0] * wedge.rays[0][0] + coefficients[1] * wedge.rays[1][0],
        coefficients[0] * wedge.rays[0][1] + coefficients[1] * wedge.rays[1][1]
      ];
    }

    function liftedPoint(wedge, coefficients) {
      const xy = planePoint(wedge, coefficients);
      return wedge.vertex.map((value, row) => value + wedge.basis[row][0] * xy[0] + wedge.basis[row][1] * xy[1]);
    }

    function displayedPoint(wedge, xy) {
      return [wedge.mirror ? -xy[0] : xy[0], xy[1]];
    }

    function toPanelPixels(wedge, xy, side) {
      const point = displayedPoint(wedge, xy);
      const xMin = side === 0 ? -view.high : 0;
      const xMax = side === 0 ? 0 : view.high;
      const panelLeft = side === 0 ? view.left : view.seamX;
      return [
        panelLeft + ((point[0] - xMin) / (xMax - xMin)) * view.halfWidth,
        view.top + view.plotHeight - ((point[1] - view.low) / (view.high - view.low)) * view.plotHeight
      ];
    }

    function fromPanelPixels(wedge, px, py, side) {
      const xMin = side === 0 ? -view.high : 0;
      const xMax = side === 0 ? 0 : view.high;
      const panelLeft = side === 0 ? view.left : view.seamX;
      const displayedX = xMin + ((px - panelLeft) / view.halfWidth) * (xMax - xMin);
      const displayedY = view.low + ((view.top + view.plotHeight - py) / view.plotHeight) * (view.high - view.low);
      return [wedge.mirror ? -displayedX : displayedX, displayedY];
    }

    function coefficientsForPoint(wedge, xy) {
      const r0 = wedge.rays[0];
      const r1 = wedge.rays[1];
      const det = r0[0] * r1[1] - r1[0] * r0[1];
      return [
        (xy[0] * r1[1] - r1[0] * xy[1]) / det,
        (r0[0] * xy[1] - xy[0] * r0[1]) / det
      ];
    }

    function renderFiberPanels() {
      fiberGrid.replaceChildren();
      [0, 1].forEach(component => {
        const wedgeIndexes = geometry.wedges
          .map((wedge, index) => ({ wedge, index }))
          .filter(item => item.wedge.component === component)
          .map(item => item.index);
        const componentColor = component === 0 ? "var(--blue)" : "var(--red)";
        const button = document.createElement("button");
        button.type = "button";
        button.className = "wedge-button";
        button.dataset.component = String(component);
        button.style.setProperty("--component-color", componentColor);
        button.setAttribute(
          "aria-label",
          `Fiber component ${component + 1}: ${wedgeIndexes.map(index => maskLabel(geometry.wedges[index].maskIds)).join(" and ")}. Click or drag to select a point.`
        );

        const svg = svgEl("svg", {
          viewBox: `0 0 ${view.width} ${view.height}`,
          role: "img",
          "aria-label": `Two projected wedges joined at the vertex of fiber component ${component + 1}`
        });
        const defs = svgEl("defs");
        const clip = svgEl("clipPath", { id: `component-clip-${component}` });
        clip.appendChild(svgEl("rect", {
          x: view.left,
          y: view.top,
          width: 2 * view.halfWidth,
          height: view.plotHeight
        }));
        defs.appendChild(clip);
        svg.appendChild(defs);

        const clipped = svgEl("g", { "clip-path": `url(#component-clip-${component})` });
        wedgeIndexes.forEach((index, side) => {
          const wedge = geometry.wedges[index];
          const origin = toPanelPixels(wedge, [0, 0], side);
          const rayEnd0 = toPanelPixels(wedge, wedge.rays[0].map(value => value * 12), side);
          const rayEnd1 = toPanelPixels(wedge, wedge.rays[1].map(value => value * 12), side);
          clipped.appendChild(svgEl("polygon", {
            points: `${origin.join(",")} ${rayEnd0.join(",")} ${rayEnd1.join(",")}`,
            fill: component === 0 ? "var(--blue-fill)" : "var(--red-fill)",
            "fill-opacity": "0.72"
          }));
          [rayEnd0, rayEnd1].forEach(end => {
            clipped.appendChild(svgEl("line", {
              x1: origin[0], y1: origin[1], x2: end[0], y2: end[1],
              class: "fiber-ray",
              stroke: componentColor
            }));
          });
        });
        svg.appendChild(clipped);
        svg.appendChild(svgEl("rect", {
          x: view.left, y: view.top, width: 2 * view.halfWidth, height: view.plotHeight,
          class: "plot-border"
        }));
        svg.appendChild(svgEl("line", {
          x1: view.seamX,
          y1: view.top,
          x2: view.seamX,
          y2: view.top + view.plotHeight,
          class: "chart-break-line"
        }));

        const commonOrigin = toPanelPixels(geometry.wedges[wedgeIndexes[0]], [0, 0], 0);
        svg.appendChild(svgEl("circle", {
          cx: view.seamX, cy: commonOrigin[1], r: 5.2,
          fill: componentColor, stroke: "#222222", "stroke-width": "1.1"
        }));

        wedgeIndexes.forEach((index, side) => {
          const wedge = geometry.wedges[index];
          const labelPoint = planePoint(wedge, [0.78, 0.82]);
          const labelPixels = toPanelPixels(wedge, labelPoint, side);
          svg.appendChild(svgEl("text", {
            x: labelPixels[0], y: labelPixels[1],
            class: "plot-label", "text-anchor": "middle"
          }, maskLabel(wedge.maskIds)));

          if (index === state.selected) {
            const selectedPixels = toPanelPixels(wedge, planePoint(wedge, state.coefficients[index]), side);
            svg.appendChild(svgEl("circle", {
              cx: selectedPixels[0], cy: selectedPixels[1], r: 7.6,
              fill: "#ffffff", stroke: componentColor, "stroke-width": "3"
            }));
            svg.appendChild(svgEl("circle", {
              cx: selectedPixels[0], cy: selectedPixels[1], r: 2.7,
              fill: componentColor
            }));
          }
        });

        button.append(svg);
        fiberGrid.appendChild(button);
      });
    }

    function lineSegment(coefficients, bbox) {
      const [wx, wy, bias] = coefficients;
      const [xmin, xmax, ymin, ymax] = bbox;
      const points = [];
      const epsilon = 1e-10;
      const add = (x, y) => {
        if (x < xmin - epsilon || x > xmax + epsilon || y < ymin - epsilon || y > ymax + epsilon) return;
        if (!points.some(p => Math.hypot(p[0] - x, p[1] - y) < 1e-7)) points.push([x, y]);
      };
      if (Math.abs(wy) > epsilon) {
        add(xmin, -(wx * xmin + bias) / wy);
        add(xmax, -(wx * xmax + bias) / wy);
      }
      if (Math.abs(wx) > epsilon) {
        add(-(wy * ymin + bias) / wx, ymin);
        add(-(wy * ymax + bias) / wx, ymax);
      }
      return points.length >= 2 ? points.slice(0, 2) : null;
    }

    function activeHalfspacePolygon(coefficients, bbox) {
      const [wx, wy, bias] = coefficients;
      const [xmin, xmax, ymin, ymax] = bbox;
      const polygon = [[xmin, ymin], [xmax, ymin], [xmax, ymax], [xmin, ymax]];
      const value = point => wx * point[0] + wy * point[1] + bias;
      const clipped = [];
      const epsilon = 1e-10;

      for (let i = 0; i < polygon.length; i += 1) {
        const current = polygon[i];
        const next = polygon[(i + 1) % polygon.length];
        const currentValue = value(current);
        const nextValue = value(next);
        const currentInside = currentValue >= -epsilon;
        const nextInside = nextValue >= -epsilon;

        if (currentInside) clipped.push(current);
        if (currentInside !== nextInside) {
          const t = currentValue / (currentValue - nextValue);
          clipped.push([
            current[0] + t * (next[0] - current[0]),
            current[1] + t * (next[1] - current[1])
          ]);
        }
      }
      return clipped;
    }

    function renderPartition() {
      const wedge = geometry.wedges[state.selected];
      const coeffs = state.coefficients[state.selected];
      const u = liftedPoint(wedge, coeffs);
      const chartSigns = geometry.signChart.split("").map(char => char === "+" ? 1 : -1);
      const neuronWeights = chartSigns.map((sign, h) => u.slice(h * 3, h * 3 + 3).map(value => sign * value));
      const bbox = [-1.35, 3.35, -1.35, 3.35];
      const plot = { left: 62, top: 24, size: 390 };
      const mapX = x => plot.left + ((x - bbox[0]) / (bbox[1] - bbox[0])) * plot.size;
      const mapY = y => plot.top + plot.size - ((y - bbox[2]) / (bbox[3] - bbox[2])) * plot.size;

      partitionSvg.replaceChildren();
      partitionSvg.appendChild(svgEl("title", { id: "partition-svg-title" }, "Input-space partition at the selected fiber point"));
      partitionSvg.appendChild(svgEl("desc", { id: "partition-svg-desc" }, "Five training inputs and the zero-preactivation lines of two hidden ReLU neurons."));
      const defs = svgEl("defs");
      const clip = svgEl("clipPath", { id: "partition-clip" });
      clip.appendChild(svgEl("rect", { x: plot.left, y: plot.top, width: plot.size, height: plot.size }));
      defs.appendChild(clip);
      partitionSvg.appendChild(defs);

      const clipped = svgEl("g", { "clip-path": "url(#partition-clip)" });
      neuronWeights.forEach((weights, h) => {
        const activeHalfspace = activeHalfspacePolygon(weights, bbox);
        const color = h === 0 ? "var(--neuron-1)" : "var(--neuron-2)";
        if (activeHalfspace.length >= 3) {
          clipped.appendChild(svgEl("polygon", {
            points: activeHalfspace.map(point => `${mapX(point[0])},${mapY(point[1])}`).join(" "),
            fill: color,
            "fill-opacity": "0.07"
          }));
        }
        const segment = lineSegment(weights, bbox);
        if (!segment) return;
        clipped.appendChild(svgEl("line", {
          x1: mapX(segment[0][0]), y1: mapY(segment[0][1]),
          x2: mapX(segment[1][0]), y2: mapY(segment[1][1]),
          class: "partition-line",
          stroke: color
        }));
      });
      partitionSvg.appendChild(clipped);

      partitionSvg.appendChild(svgEl("rect", {
        x: plot.left, y: plot.top, width: plot.size, height: plot.size,
        class: "plot-border"
      }));

      [0, 1, 2].forEach(tick => {
        const x = mapX(tick);
        const y = mapY(tick);
        partitionSvg.appendChild(svgEl("line", { x1: x, y1: plot.top + plot.size, x2: x, y2: plot.top + plot.size + 7, class: "tick-line" }));
        partitionSvg.appendChild(svgEl("text", { x, y: plot.top + plot.size + 24, class: "tick-label", "text-anchor": "middle" }, String(tick)));
        partitionSvg.appendChild(svgEl("line", { x1: plot.left - 7, y1: y, x2: plot.left, y2: y, class: "tick-line" }));
        partitionSvg.appendChild(svgEl("text", { x: plot.left - 13, y: y + 4, class: "tick-label", "text-anchor": "end" }, String(tick)));
      });
      partitionSvg.appendChild(svgEl("text", { x: plot.left + plot.size / 2, y: 463, class: "axis-label", "text-anchor": "middle" }, "a"));
      partitionSvg.appendChild(svgEl("text", { x: 18, y: plot.top + plot.size / 2, class: "axis-label", "text-anchor": "middle", transform: `rotate(-90 18 ${plot.top + plot.size / 2})` }, "b"));

      geometry.trainPairs.forEach((pair, i) => {
        partitionSvg.appendChild(svgEl("circle", {
          cx: mapX(pair[0]), cy: mapY(pair[1]), r: 10.5,
          class: "train-point",
          fill: `var(--target-${geometry.trainY[i]})`
        }));
      });

      const legendY = 490;
      const legend = [
        { x: 62, kind: "point", color: "var(--target-0)", label: "y=0" },
        { x: 118, kind: "point", color: "var(--target-1)", label: "y=1" },
        { x: 174, kind: "point", color: "var(--target-2)", label: "y=2" },
        { x: 258, kind: "line", color: "var(--neuron-1)", label: "Neuron 1" },
        { x: 358, kind: "line", color: "var(--neuron-2)", label: "Neuron 2" }
      ];
      legend.forEach(item => {
        if (item.kind === "point") {
          partitionSvg.appendChild(svgEl("circle", { cx: item.x, cy: legendY - 4, r: 5.2, fill: item.color }));
          partitionSvg.appendChild(svgEl("text", { x: item.x + 10, y: legendY, class: "legend-label" }, item.label));
        } else {
          partitionSvg.appendChild(svgEl("rect", { x: item.x, y: legendY - 12, width: 20, height: 16, fill: item.color, "fill-opacity": "0.07" }));
          partitionSvg.appendChild(svgEl("line", { x1: item.x, y1: legendY - 4, x2: item.x + 20, y2: legendY - 4, class: "partition-line", stroke: item.color }));
          partitionSvg.appendChild(svgEl("text", { x: item.x + 27, y: legendY, class: "legend-label" }, item.label));
        }
      });

      partitionNote.textContent = "Active halfspace highlighted";
    }

    function selectFromPointer(button, event) {
      const component = Number(button.dataset.component);
      const svg = button.querySelector("svg");
      const rect = svg.getBoundingClientRect();
      const px = ((event.clientX - rect.left) / rect.width) * view.width;
      const py = ((event.clientY - rect.top) / rect.height) * view.height;
      if (px < view.left || px > view.left + 2 * view.halfWidth || py < view.top || py > view.top + view.plotHeight) return false;
      const side = px < view.seamX ? 0 : 1;
      const wedgeIndexes = geometry.wedges
        .map((wedge, index) => ({ wedge, index }))
        .filter(item => item.wedge.component === component)
        .map(item => item.index);
      const index = wedgeIndexes[side];
      const wedge = geometry.wedges[index];
      const xy = fromPanelPixels(wedge, px, py, side);
      const coefficients = coefficientsForPoint(wedge, xy);
      if (coefficients[0] < -0.02 || coefficients[1] < -0.02) return false;
      state.selected = index;
      state.coefficients[index] = coefficients.map(value => Math.max(0, value));
      renderFiberPanels();
      renderPartition();
      return true;
    }

    fiberGrid.addEventListener("pointerdown", event => {
      const button = event.target.closest(".wedge-button");
      if (!button) return;
      if (selectFromPointer(button, event)) {
        state.dragging = true;
        event.preventDefault();
      }
    });

    fiberGrid.addEventListener("pointermove", event => {
      if (!state.dragging) return;
      const selectedComponent = geometry.wedges[state.selected].component;
      const button = event.target.closest(".wedge-button") || fiberGrid.querySelector(`[data-component="${selectedComponent}"]`);
      if (button) selectFromPointer(button, event);
    });

    fiberGrid.addEventListener("pointerup", event => {
      state.dragging = false;
    });

    fiberGrid.addEventListener("pointercancel", () => {
      state.dragging = false;
    });

    window.addEventListener("pointerup", () => {
      state.dragging = false;
    });

    window.addEventListener("pointercancel", () => {
      state.dragging = false;
    });

    renderFiberPanels();
    renderPartition();
  </script>
</body>
</html>
