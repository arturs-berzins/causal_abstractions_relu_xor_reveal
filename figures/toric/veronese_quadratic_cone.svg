<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Real quadratic cone</title>
  <desc id="desc">A simple static view of the real variety u one times u three equals u two squared, shown after a linear change of coordinates as a double cone.</desc>

  <defs>
    <style>
      .surface-a { fill: #e6f0ef; }
      .surface-b { fill: #f1f2ef; }
      .outline { fill: none; stroke: #303841; stroke-width: 3; stroke-linecap: round; }
      .section { fill: none; stroke: #9aa2a5; stroke-width: 1.8; }
      .hidden { fill: none; stroke: #b6bbbd; stroke-width: 1.6; stroke-dasharray: 7 7; }
      .apex { fill: #303841; }
    </style>
  </defs>

  <!-- Upper and lower nappes of the real quadratic cone. -->
  <path class="surface-b" d="M218 46 Q380 96 542 46 L380 180 Z"/>
  <path class="surface-a" d="M380 180 L218 314 Q380 264 542 314 Z"/>

  <path class="outline" d="M218 46 L380 180 L218 314"/>
  <path class="outline" d="M542 46 L380 180 L542 314"/>

  <path class="section" d="M218 46 Q380 10 542 46"/>
  <path class="hidden" d="M218 46 Q380 82 542 46"/>
  <path class="section" d="M218 314 Q380 350 542 314"/>
  <path class="hidden" d="M218 314 Q380 278 542 314"/>

  <path class="section" d="M300 113 Q380 93 460 113"/>
  <path class="hidden" d="M300 113 Q380 133 460 113"/>
  <path class="section" d="M300 247 Q380 267 460 247"/>
  <path class="hidden" d="M300 247 Q380 227 460 247"/>

  <circle class="apex" cx="380" cy="180" r="8"/>
</svg>
