<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" role="img" aria-labelledby="title desc">
  <title id="title">Veronese exponent lattice and toric fan resolution</title>
  <desc id="desc">The Veronese exponent vectors are shown in the character lattice. In the dual lattice, the singular cone has determinant two. Adding its middle ray subdivides it into two determinant-one cones.</desc>

  <defs>
    <style>
      .text { fill: #303841; font-family: "STIX Two Text", Georgia, serif; }
      .label { font-size: 21px; }
      .small { font-size: 18px; fill: #60686d; }
      .grid { stroke: #e2e4e1; stroke-width: 1.2; }
      .axis { stroke: #9aa0a4; stroke-width: 1.6; }
      .ray { stroke: #303841; stroke-width: 3; stroke-linecap: round; }
      .new-ray { stroke: #26727a; stroke-width: 3.5; stroke-linecap: round; }
      .slice { stroke: #7f898d; stroke-width: 2; stroke-dasharray: 6 6; }
      .point { fill: #303841; }
      .new-point { fill: #26727a; }
      .cone { fill: #f0f1ee; }
      .cone-a { fill: #e2eeed; }
      .cone-b { fill: #f3f3f0; }
      .separator { stroke: #d5d8d5; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #777e82; stroke-width: 2.4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777e82"/>
    </marker>
  </defs>

  <!-- Exponent configuration in M. -->
  <g aria-label="Exponent lattice">
    <g class="grid">
      <line x1="40" y1="35" x2="310" y2="35"/>
      <line x1="40" y1="95" x2="310" y2="95"/>
      <line x1="40" y1="155" x2="310" y2="155"/>
      <line x1="40" y1="215" x2="310" y2="215"/>
      <line x1="70" y1="25" x2="70" y2="230"/>
      <line x1="130" y1="25" x2="130" y2="230"/>
      <line x1="190" y1="25" x2="190" y2="230"/>
      <line x1="250" y1="25" x2="250" y2="230"/>
      <line x1="310" y1="25" x2="310" y2="230"/>
    </g>
    <line class="axis" x1="30" y1="215" x2="320" y2="215"/>
    <line class="axis" x1="70" y1="235" x2="70" y2="20"/>
    <line class="slice" x1="70" y1="95" x2="190" y2="215"/>
    <circle class="point" cx="190" cy="215" r="7"/>
    <circle class="new-point" cx="130" cy="155" r="7"/>
    <circle class="point" cx="70" cy="95" r="7"/>
    <text class="text label" x="199" y="202">
      <tspan font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="14">1</tspan>
    </text>
    <text class="text label" x="140" y="145">
      <tspan font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="14">2</tspan>
    </text>
    <text class="text label" x="81" y="83">
      <tspan font-style="italic">b</tspan><tspan baseline-shift="sub" font-size="14">3</tspan>
    </text>
    <text class="text small" x="175" y="263" text-anchor="middle">exponent lattice M</text>
  </g>

  <line class="separator" x1="345" y1="25" x2="345" y2="255"/>

  <!-- Singular fan cone in the dual lattice. -->
  <g aria-label="Singular cone before subdivision">
    <polygon class="cone" points="485,220 420,70 550,70"/>
    <line class="ray" x1="485" y1="220" x2="420" y2="70"/>
    <line class="ray" x1="485" y1="220" x2="550" y2="70"/>
    <circle class="point" cx="485" cy="220" r="6"/>
    <circle class="point" cx="420" cy="70" r="6"/>
    <circle class="point" cx="550" cy="70" r="6"/>
    <text class="text label" x="392" y="61">
      <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="14">−</tspan>
    </text>
    <text class="text label" x="560" y="61">
      <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="14">+</tspan>
    </text>
    <text class="text small" x="485" y="248" text-anchor="middle">determinant 2: singular</text>
  </g>

  <path class="arrow" d="M600 145 L690 145"/>
  <text class="text small" x="645" y="126" text-anchor="middle">subdivide</text>

  <!-- Smooth subdivision by the primitive middle ray. -->
  <g aria-label="Smooth fan after subdivision">
    <polygon class="cone-a" points="835,220 770,70 835,60"/>
    <polygon class="cone-b" points="835,220 835,60 900,70"/>
    <line class="ray" x1="835" y1="220" x2="770" y2="70"/>
    <line class="ray" x1="835" y1="220" x2="900" y2="70"/>
    <line class="new-ray" x1="835" y1="220" x2="835" y2="60"/>
    <circle class="point" cx="835" cy="220" r="6"/>
    <circle class="point" cx="770" cy="70" r="6"/>
    <circle class="new-point" cx="835" cy="60" r="6"/>
    <circle class="point" cx="900" cy="70" r="6"/>
    <text class="text label" x="742" y="61">
      <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="14">−</tspan>
    </text>
    <text class="text label" x="843" y="47">
      <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="14">0</tspan>
    </text>
    <text class="text label" x="910" y="61">
      <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="14">+</tspan>
    </text>
    <text class="text small" x="835" y="248" text-anchor="middle">determinants 1 and 1: smooth</text>
  </g>

  <text class="text small" x="680" y="275" text-anchor="middle">fan in the dual lattice N</text>
</svg>
