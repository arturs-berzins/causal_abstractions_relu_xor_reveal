<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive toric path-image cone</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #303841;
      --muted: #747b80;
      --grid: #d7dcde;
      --surface: #26727a;
      --surface-dark: #185d65;
      --surface-light: #a9cfd1;
      --section: #b7473b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    main {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cone-plot {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #cone-plot.rotating {
      cursor: grabbing;
    }

    .grid-line,
    .axis-line,
    .surface-rim,
    .surface-generator,
    .section-line {
      vector-effect: non-scaling-stroke;
    }

    .grid-line {
      fill: none;
      stroke: var(--grid);
      stroke-width: 0.85;
      opacity: 0.55;
    }

    .axis-line {
      fill: none;
      stroke: #5c6469;
      stroke-width: 1.45;
    }

    .surface-triangle {
      stroke: none;
    }

    .surface-rim {
      fill: none;
      stroke: var(--surface-dark);
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.78;
    }

    .surface-generator {
      fill: none;
      stroke: var(--surface-dark);
      stroke-width: 0.9;
      stroke-linecap: round;
      opacity: 0.30;
    }

    .section-line {
      fill: none;
      stroke: var(--section);
      stroke-width: 3.6;
      stroke-linecap: round;
    }

    .axis-label,
    .math-label {
      pointer-events: none;
    }

    .axis-label,
    .math-label {
      fill: var(--ink);
      font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .axis-label {
      font-size: 30px;
    }

    .math-label {
      font-size: 30px;
    }

    .math-subscript {
      font-size: 20px;
      baseline-shift: sub;
    }

  </style>
</head>
<body>
  <main>
    <svg id="cone-plot" viewBox="0 0 900 650" role="img" aria-labelledby="plot-title plot-desc"></svg>
  </main>

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("cone-plot");
    const mode = new URLSearchParams(window.location.search).get("mode") === "affine"
      ? "affine"
      : "linear";

    const view = mode === "affine"
      ? { width: 900, height: 540 }
      : { width: 900, height: 632 };
    svg.setAttribute("viewBox", `0 0 ${view.width} ${view.height}`);

    const state = {
      camera: { azimuth: -0.40, elevation: 0.38, zoom: mode === "affine" ? 0.94 : 1.02 },
      initialCamera: null,
      drag: null,
      renderPending: false
    };
    state.initialCamera = { ...state.camera };

    const bounds = { u11: 1.48, u22: 1.48, u12: 1.02 };
    const center = { x: mode === "affine" ? 470 : 475, y: mode === "affine" ? 310 : 336 };
    const baseScale = mode === "affine" ? 230 : 250;
    const lightDirection = normalize([0.20, -0.30, 0.93]);

    function svgEl(name, attrs = {}, text = null) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (text !== null) node.textContent = text;
      return node;
    }

    function normalize(vector) {
      const length = Math.hypot(...vector) || 1;
      return vector.map(value => value / length);
    }

    function subtract(a, b) {
      return a.map((value, i) => value - b[i]);
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function dot(a, b) {
      return a.reduce((sum, value, i) => sum + value * b[i], 0);
    }

    function project(point) {
      const { azimuth, elevation, zoom } = state.camera;
      const ca = Math.cos(azimuth);
      const sa = Math.sin(azimuth);
      const ce = Math.cos(elevation);
      const se = Math.sin(elevation);
      const right = [sa, -ca, 0];
      const up = [-se * ca, -se * sa, ce];
      const toward = [ce * ca, ce * sa, se];
      const scale = baseScale * zoom;
      return {
        x: center.x + scale * dot(point, right),
        y: center.y - scale * dot(point, up),
        depth: dot(point, toward)
      };
    }

    function conePoint(sign, radius, theta) {
      const c = Math.cos(theta);
      const s = Math.sin(theta);
      const scale = 1.25;
      return [
        scale * radius * (sign + c),
        scale * radius * (sign - c),
        scale * radius * s
      ];
    }

    function buildConeFaces() {
      const faces = [];
      const radialSteps = 9;
      const angularSteps = 40;
      const radiusMax = 0.50;

      for (const sign of [1, -1]) {
        for (let radial = 0; radial < radialSteps; radial += 1) {
          const r0 = radiusMax * radial / radialSteps;
          const r1 = radiusMax * (radial + 1) / radialSteps;
          for (let angular = 0; angular < angularSteps; angular += 1) {
            const t0 = 2 * Math.PI * angular / angularSteps;
            const t1 = 2 * Math.PI * (angular + 1) / angularSteps;
            const outer0 = conePoint(sign, r1, t0);
            const outer1 = conePoint(sign, r1, t1);

            if (radial === 0) {
              faces.push([[0, 0, 0], outer0, outer1]);
            } else {
              const inner0 = conePoint(sign, r0, t0);
              const inner1 = conePoint(sign, r0, t1);
              faces.push([inner0, outer0, outer1]);
              faces.push([inner0, outer1, inner1]);
            }
          }
        }
      }
      return faces;
    }

    const coneFaces = buildConeFaces();

    function line3d(a, b, className, attrs = {}) {
      const pa = project(a);
      const pb = project(b);
      return svgEl("line", {
        x1: pa.x,
        y1: pa.y,
        x2: pb.x,
        y2: pb.y,
        class: className,
        ...attrs
      });
    }

    function polyline3d(points, className, attrs = {}) {
      return svgEl("polyline", {
        points: points.map(point => {
          const projected = project(point);
          return `${projected.x},${projected.y}`;
        }).join(" "),
        class: className,
        ...attrs
      });
    }

    function appendGrid(root) {
      const ticks = [-1, -0.5, 0, 0.5, 1];
      const z = -bounds.u12;
      ticks.forEach(tick => {
        root.appendChild(line3d([-bounds.u11, tick, z], [bounds.u11, tick, z], "grid-line"));
        root.appendChild(line3d([tick, -bounds.u22, z], [tick, bounds.u22, z], "grid-line"));
      });
    }

    function appendAxes(root) {
      const axes = [
        { a: [-bounds.u11, 0, 0], b: [bounds.u11, 0, 0], labelPoint: [1.426, 0, 0], base: "u", sub: "11" },
        { a: [0, -bounds.u22, 0], b: [0, bounds.u22, 0], labelPoint: [0, 1.426, 0], base: "u", sub: "22" },
        { a: [0, 0, -bounds.u12], b: [0, 0, bounds.u12], labelPoint: [0, 0, 0.836], base: "u", sub: "12" }
      ];

      axes.forEach(axis => {
        root.appendChild(line3d(axis.a, axis.b, "axis-line", { "marker-end": "url(#axis-arrow)" }));
        const p = project(axis.labelPoint);
        const label = svgEl("text", {
          x: p.x + (p.x >= center.x ? 10 : -10),
          y: p.y - 8,
          class: "axis-label",
          "text-anchor": p.x >= center.x ? "start" : "end"
        });
        label.appendChild(svgEl("tspan", {}, axis.base));
        label.appendChild(svgEl("tspan", { class: "math-subscript" }, axis.sub));
        if (axis.sub === "12") {
          label.appendChild(svgEl("tspan", { "font-style": "normal" }, " = "));
          label.appendChild(svgEl("tspan", {}, "u"));
          label.appendChild(svgEl("tspan", { class: "math-subscript" }, "21"));
        }
        root.appendChild(label);
      });
    }

    function appendSurface(root) {
      const projectedFaces = coneFaces.map(vertices => {
        const screen = vertices.map(project);
        const normal = normalize(cross(subtract(vertices[1], vertices[0]), subtract(vertices[2], vertices[0])));
        const light = 0.40 + 0.60 * Math.abs(dot(normal, lightDirection));
        return {
          screen,
          depth: screen.reduce((sum, point) => sum + point.depth, 0) / 3,
          light
        };
      }).sort((a, b) => a.depth - b.depth);

      const minDepth = projectedFaces[0]?.depth ?? 0;
      const maxDepth = projectedFaces.at(-1)?.depth ?? 1;
      const depthRange = Math.max(maxDepth - minDepth, 1e-6);

      projectedFaces.forEach(face => {
        const nearness = (face.depth - minDepth) / depthRange;
        const lightness = 82 - 11 * face.light - 9 * nearness;
        const baseOpacity = mode === "affine" ? 0.66 : 0.70;
        root.appendChild(svgEl("polygon", {
          points: face.screen.map(point => `${point.x},${point.y}`).join(" "),
          class: "surface-triangle",
          fill: `hsl(184 30% ${lightness}%)`,
          "fill-opacity": baseOpacity * (0.58 + 0.42 * nearness)
        }));
      });

      const structure = svgEl("g", { "pointer-events": "none" });
      for (const sign of [1, -1]) {
        const rim = [];
        for (let i = 0; i <= 80; i += 1) {
          rim.push(conePoint(sign, 0.50, 2 * Math.PI * i / 80));
        }
        for (let i = 0; i < rim.length - 1; i += 1) {
          const segmentDepth = (project(rim[i]).depth + project(rim[i + 1]).depth) / 2;
          const nearness = (segmentDepth - minDepth) / depthRange;
          structure.appendChild(line3d(rim[i], rim[i + 1], "surface-rim", {
            style: `stroke-width: ${0.75 + 1.15 * nearness}px; opacity: ${0.18 + 0.68 * nearness}`
          }));
        }

        for (let i = 0; i < 8; i += 1) {
          const theta = 2 * Math.PI * i / 8;
          const outer = conePoint(sign, 0.50, theta);
          const nearness = (project(outer).depth - minDepth) / depthRange;
          structure.appendChild(line3d([0, 0, 0], outer, "surface-generator", {
            style: `stroke-width: ${0.7 + 0.5 * nearness}px; opacity: ${0.10 + 0.28 * nearness}`
          }));
        }
      }
      root.appendChild(structure);
    }

    function appendLabel(root, point, kind) {
      const p = project(point);
      const label = svgEl("text", {
        x: p.x,
        y: p.y,
        class: "math-label",
        "text-anchor": kind === "surface" ? "start" : "middle"
      });

      if (kind === "surface") {
        label.appendChild(svgEl("tspan", {}, "Σ"));
        label.appendChild(svgEl("tspan", { class: "math-subscript" }, "𝒲"));
      } else {
        label.appendChild(svgEl("tspan", {}, "H"));
        label.appendChild(svgEl("tspan", { class: "math-subscript" }, "X,κ"));
        label.appendChild(svgEl("tspan", {}, "(Y)"));
      }
      root.appendChild(label);
    }

    function appendAffineSection(root) {
      const points = [];
      for (let i = 0; i <= 90; i += 1) {
        const t = -0.44 + (i / 90) * 1.42;
        points.push([1 - t, 1 - t, t]);
      }
      root.appendChild(polyline3d(points, "section-line"));

      appendLabel(root, [1.15, 1.15, -0.15], "section");
      appendLabel(root, [0.66, 0.22, 0.38], "surface");
    }

    function appendDefinitions(root) {
      const defs = svgEl("defs");
      const marker = svgEl("marker", {
        id: "axis-arrow",
        viewBox: "0 0 10 10",
        refX: 8.5,
        refY: 5,
        markerWidth: 6,
        markerHeight: 6,
        orient: "auto-start-reverse"
      });
      marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#5c6469" }));
      defs.appendChild(marker);
      root.appendChild(defs);
    }

    function render() {
      svg.replaceChildren();
      svg.appendChild(svgEl("title", { id: "plot-title" }, mode === "affine"
        ? "Affine readout line meeting the toric path-image cone"
        : "Rank-one toric path-image cone"));
      svg.appendChild(svgEl("desc", { id: "plot-desc" }, mode === "affine"
        ? "A rotatable double cone in path coordinates with the affine readout line H X kappa of Y."
        : "A rotatable double cone satisfying u eleven times u twenty-two equals u twelve squared."));
      appendDefinitions(svg);

      const grid = svgEl("g", { "pointer-events": "none" });
      appendGrid(grid);
      svg.appendChild(grid);

      const surface = svgEl("g", { "pointer-events": "none" });
      appendSurface(surface);
      svg.appendChild(surface);

      if (mode === "affine") {
        const section = svgEl("g", { "pointer-events": "none" });
        appendAffineSection(section);
        svg.appendChild(section);
      }

      const axes = svgEl("g", { "pointer-events": "none" });
      appendAxes(axes);
      svg.appendChild(axes);

      svg.appendChild(svgEl("rect", {
        x: 0,
        y: 0,
        width: view.width,
        height: view.height,
        fill: "#ffffff",
        "fill-opacity": 0,
        "pointer-events": "all"
      }));
    }

    function scheduleRender() {
      if (state.renderPending) return;
      state.renderPending = true;
      requestAnimationFrame(() => {
        state.renderPending = false;
        render();
      });
    }

    svg.addEventListener("pointerdown", event => {
      state.drag = {
        pointerId: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        azimuth: state.camera.azimuth,
        elevation: state.camera.elevation
      };
      svg.classList.add("rotating");
      svg.setPointerCapture(event.pointerId);
    });

    svg.addEventListener("pointermove", event => {
      if (!state.drag || state.drag.pointerId !== event.pointerId) return;
      const rect = svg.getBoundingClientRect();
      const dx = (event.clientX - state.drag.x) / Math.max(rect.width, 1);
      const dy = (event.clientY - state.drag.y) / Math.max(rect.height, 1);
      state.camera.azimuth = state.drag.azimuth + dx * 4.5;
      state.camera.elevation = Math.max(-1.15, Math.min(1.15, state.drag.elevation + dy * 3.6));
      scheduleRender();
    });

    function endRotation(event) {
      if (!state.drag || state.drag.pointerId !== event.pointerId) return;
      state.drag = null;
      svg.classList.remove("rotating");
      if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    }

    svg.addEventListener("pointerup", endRotation);
    svg.addEventListener("pointercancel", endRotation);
    svg.addEventListener("dblclick", () => {
      state.camera = { ...state.initialCamera };
      scheduleRender();
    });

    render();
  </script>
</body>
</html>
